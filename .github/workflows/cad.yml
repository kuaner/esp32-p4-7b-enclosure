name: CAD checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: false
        type: string
        default: ''
      export_models:
        description: Upload rebuilt models for the release job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - name: Verify published files and evidence
        run: python cad/check_release.py
      - name: Install CAD dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libopengl0
          python -m pip install -r cad/requirements.txt
      - name: Compile source
        run: python -m compileall -q cad
      - name: Build three printable solids
        id: models
        run: python cad/build_design.py
      - name: Verify rebuilt STL matches checked geometry
        run: python cad/check_rebuild.py
      - name: Audit speaker and stand layer geometry
        run: python cad/check_printability.py
      - name: Keep rebuilt models for failed-check diagnosis
        if: failure() && steps.models.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-diagnostic
          path: output/current/STL/*.stl
          retention-days: 1
      - name: Preserve exact sliced STL inputs for publication
        if: inputs.export_models
        run: git restore -- output/current/STL
      - name: Upload rebuilt models
        if: inputs.export_models
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: models
          path: |
            output/current/STL/*.stl
            output/current/STEP/*.step
          if-no-files-found: error
          retention-days: 1
      # Vendor-dependent board checks and macOS Bambu slicing run locally.
