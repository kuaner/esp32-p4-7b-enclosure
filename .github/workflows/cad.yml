name: CAD checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - name: Verify published files and evidence
        run: python cad/check_release.py
      - name: Install CAD dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libopengl0
          python -m pip install -r cad/requirements.txt
      - name: Compile source
        run: python -m compileall -q cad
      - name: Build three printable solids
        run: python cad/build_design.py
      - name: Audit speaker and stand layer geometry
        run: python cad/check_printability.py
      # Vendor-dependent board checks and macOS Bambu slicing run locally.
