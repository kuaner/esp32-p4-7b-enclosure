name: Release models

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/cad.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      export_models: true
    permissions:
      contents: read

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate tag and checked inputs
        shell: bash
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          python cad/check_release.py
      - name: Remove checkout exports before downloading build output
        run: rm -r output/current/STL output/current/STEP
      - name: Download rebuilt models
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models
          path: output/current
      - name: Prepare model checksums
        run: |
          python cad/prepare_release.py
      - name: Publish model assets
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          - `shell`：主壳；`speaker`：喇叭盒；`stand`：底座，各提供 STL 和 STEP。
          - `assembly.step`：装配；`expansion_adapter.step`：扩展接口模板。
          - `SHA256SUMS.txt`：文件校验值。

          模型由此 tag 自动构建。STL 保持初始方向、100% 比例，关闭支撑。当前修正仍需实物复测。
          NOTES
          assets=(output/current/STL/*.stl output/current/STEP/*.step output/SHA256SUMS.txt)
          if gh release view -- "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload --clobber -- "$RELEASE_TAG" "${assets[@]}"
            gh release edit --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" -- "$RELEASE_TAG"
          else
            gh release create --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" -- "$RELEASE_TAG" "${assets[@]}"
          fi
